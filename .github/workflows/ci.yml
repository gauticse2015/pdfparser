name: CI

on:
  push:
    branches: [main, master]
  # All PR bases (including stacked review branches), not only main.
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]

    steps:
      - name: Force LF checkouts (Windows rustfmt)
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # rustfmt newline_style=Unix; skip the check on Windows if CRLF still leaks.
      - name: Format
        if: runner.os != 'Windows'
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build release CLI
        run: cargo build --release -p pdfparser-cli

  msrv:
    # Package rust-version is 1.75; lockfile crates (image/time) need rustc 1.88.
    name: Lockfile rustc 1.88
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.88
        uses: dtolnay/rust-toolchain@1.88.0
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Test lockfile on rustc 1.88
        run: cargo test --workspace --locked

  python-unit:
    name: Python metric / policy tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: IoU unit tests
        run: python3 benchmark/scripts/test_iou_metrics.py
      - name: Latency freeze unit tests
        run: python3 benchmark/scripts/test_latency_freeze.py
      - name: Assert no ICDAR
        run: python3 benchmark/scripts/assert_no_icdar.py
      - name: Phase gate 0 (measurement foundation)
        run: python3 benchmark/scripts/check_phase_gates.py --phase 0
      - name: Owned-gate checker + dump-compare unit tests
        run: python3 benchmark/scripts/test_check_phase_gates.py

  # Policy: never allow ICDAR competition PDFs/gold under benchmark data trees
  assert-no-icdar:
    name: Assert no ICDAR in corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run assert_no_icdar
        run: python3 benchmark/scripts/assert_no_icdar.py

  # Optional lightweight smoke: ensure CLI runs on a committed fixture
  cli-smoke:
    name: CLI smoke
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build & extract sample
        run: |
          cargo build --release -p pdfparser-cli
          ./target/release/pdfparser extract benchmark/corpus/01_simple_text.pdf | grep -q SIMPLE_TOKEN_ALPHA

  # Real-track freeze gates (G5.5 / P0.6). Uses **committed** latest JSON so PR
  # CI never needs a live extract. Never load ICDAR metrics (H8). Detector PRs
  # must re-run live `--binary` locally; nightly on main is required (H15).
  real-track-gates:
    name: Real-track owned gates
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Owned-only gates (no ICDAR metrics)
        run: python3 benchmark/scripts/check_phase_gates.py --owned-only
